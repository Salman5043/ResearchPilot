name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile Python
        run: uv run python -m compileall -q .

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t research-assistant:test .
