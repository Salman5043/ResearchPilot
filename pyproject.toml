[project]
name = "research-assistant"
version = "1.2.0"
description = "Evidence-grounded LangGraph AI Research Assistant with citations and self-critique"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.8.2",
    "uvicorn>=0.53.0",
]
